plugins {
    id 'com.android.application'
}

android {
    namespace 'id.palapanet.stb'
    compileSdk 34

    defaultConfig {
        applicationId "id.palapanet.stb"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        // Ganti URL di sini bila alamat berubah
        buildConfigField "String", "START_URL", "\"https://palapanetstb.duckdns.org:121/c\""
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
}
